name: P0 regression tests
on:
  pull_request:
    paths:
      - "pdf_web_toolbox_website/backend/**"
      - "pdf_web_toolbox_website/backend/app/frontend_dist/**"
      - ".github/workflows/p0-regression.yml"
      - "render.yaml"
      - "pdf_web_toolbox_website/render.yaml"
      - "pdf_web_toolbox_website/docs/render-deployment.md"
  workflow_dispatch:
jobs:
  p0:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf_web_toolbox_website/backend
    steps:
      - uses: actions/checkout@v4
      - name: Validate Render Blueprint
        run: |
          ruby -e 'require "yaml"; config = YAML.load_file("render.yaml"); service = config.fetch("services").find { |item| item["name"] == "pdf-web-toolbox" }; abort "Invalid Render service configuration" unless service && service["runtime"] == "python" && service["rootDir"] == "pdf_web_toolbox_website/backend" && service["healthCheckPath"] == "/api/health"; puts "Render Blueprint configuration passed"'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Run P0 and PDF workflow regression suite
        run: python -m pytest -q tests/test_p0.py tests/test_pdf_regression.py tests/test_workflow_blank_templates.py tests/test_result_preview.py
      - name: Check frontend JavaScript syntax
        run: |
          node --check app/frontend_dist/static/app.js
          node --check app/frontend_dist/static/workflow_extras.js
          node --check app/frontend_dist/static/result_extras.js
      - name: Verify multi-selection append behavior
        run: |
          node tests/test_upload_selection.cjs
          node tests/test_workflow_extras.cjs
          node tests/test_result_ui.cjs
