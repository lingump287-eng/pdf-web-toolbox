name: P0 regression tests
on:
  pull_request:
    paths:
      - "pdf_web_toolbox_website/backend/**"
      - ".github/workflows/p0-regression.yml"
  workflow_dispatch:
jobs:
  p0:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf_web_toolbox_website/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Run P0 tests
        run: python -m pytest -q tests/test_p0.py
